name: Build debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: network-speed-meter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk network-speed-meter-debug.apk
          if gh release view latest-debug-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest-debug-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create latest-debug-build network-speed-meter-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest debug build" \
            --notes "Auto-published debug APK from commit $GITHUB_SHA on branch $GITHUB_REF_NAME. For sideloading/testing only, not for distribution." \
            --prerelease
